<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>تسجيل الدخول - المنصة الوطنية للربط الصحي</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com https://fonts.googleapis.com data:; connect-src 'self'; img-src 'self' data: https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="./auth.css">
</head>
<body class="auth-isolated-body">
<div id="toast-container" class="toast-container"></div>
<main class="auth-isolated-wrap">
  <div class="auth-isolated-card">
    <div class="auth-isolated-head">
      <div class="auth-emblem-wrap" aria-hidden="true"><svg class="auth-emblem-svg" viewBox="0 0 24 24" fill="currentColor" width="52" height="52" aria-hidden="true" focusable="false"><path d="M13 2.5C7.2 2.5 2.5 7.2 2.5 13S7.2 23.5 13 23.5c3.3 0 6.2-1.5 8.2-3.9-.4-.1-.8-.2-1.2-.2-4.4 0-8-3.6-8-8s3.6-8 8-8c.4 0 .8-.1 1.2-.2C19.2 4 16.3 2.5 13 2.5z"/></svg></div>
      <h1>المنصة الوطنية للربط الصحي</h1>
      <p>بوابة الدخول الموحد • مصادقة سيادية مشفرة</p>
      <div class="auth-security-badge"><span class="pulse-dot"></span><span>معتمد NCA ECC-1:2018 • NPHIES</span></div>
    </div>
    <div class="auth-isolated-tabs">
      <a href="./login.html" class="auth-tab active">تسجيل الدخول</a>
      <a href="./register.html" class="auth-tab">إنشاء حساب</a>
    </div>
     <form id="login-form" class="auth-form" autocomplete="on" style="display:flex; flex-direction:column; gap:16px;">
      <div class="auth-form-group" style="margin-bottom:0;">
        <label for="login-username" style="font-weight:700; letter-spacing:-0.01em;">اسم المستخدم</label>
        <div class="auth-input-wrap"><input id="login-username" name="username" type="text" required autocomplete="username" placeholder="اسم المستخدم أو الهوية الوطنية" class="auth-input" style="padding:12px 14px;"></div>
        <small style="font-size:0.72rem; color:var(--m3-on-surface-muted);">هويتك الوطنية أو اسم المستخدم المخصص</small>
      </div>
      <div class="auth-form-group" style="margin-bottom:0;">
        <label for="login-password" style="font-weight:700; letter-spacing:-0.01em;">كلمة المرور</label>
        <div class="auth-input-wrap"><input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" class="auth-input" style="padding:12px 14px;"></div>
      </div>
      <div id="login-error" class="auth-error-box" style="display:none"><span id="login-error-text"></span></div>
      <button type="submit" id="btn-login" class="auth-submit-btn" style="margin-top:4px; padding:13px; font-weight:700; letter-spacing:0.01em;">تسجيل الدخول الآمن</button>
      <div class="auth-demo-links" style="margin-top:6px; padding-top:14px; border-top:1px solid var(--m3-outline-variant);">
        <div style="font-size:0.72rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--m3-on-surface-muted); margin-bottom:8px;">بيئة التطوير — دخول سريع</div>
        <div class="auth-demo-buttons" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <button type="button" data-fill="sys_admin" class="btn btn-secondary" style="justify-content:center; padding:8px; font-size:0.78rem; font-weight:600;">النظام</button>
          <button type="button" data-fill="moh_admin" class="btn btn-secondary" style="justify-content:center; padding:8px; font-size:0.78rem; font-weight:600;">الوزارة</button>
          <button type="button" data-fill="moh_auditor" class="btn btn-secondary" style="justify-content:center; padding:8px; font-size:0.78rem; font-weight:600;">المدقق</button>
          <button type="button" data-fill="hospital_a" class="btn btn-secondary" style="justify-content:center; padding:8px; font-size:0.78rem; font-weight:600;">المستشفى</button>
          <button type="button" data-fill="clinician" class="btn btn-secondary" style="justify-content:center; padding:8px; font-size:0.78rem; font-weight:600;">الطبيب</button>
          <button type="button" data-fill="patient" class="btn btn-secondary" style="justify-content:center; padding:8px; font-size:0.78rem; font-weight:600;">المريض</button>
        </div>
      </div>
    </form>
    <p class="auth-footer-notice">جميع المحاولات مسجلة في سجل التدقيق المشفر. عند النجاح سيتم تحويلك تلقائياً للمنصة.</p>
  </div>
</main>
<script src="./auth.js"></script>
</body>
</html>
